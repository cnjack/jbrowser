name: Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build — ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: jbrowser-control
            file: docker/Dockerfile.control
            platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
            cache-scope: control-amd64
          - image: jbrowser-control
            file: docker/Dockerfile.control
            platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
            cache-scope: control-arm64
          - image: jbrowser-agent-chromium
            file: docker/Dockerfile.agent-chromium
            platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
            cache-scope: agent-amd64
          - image: jbrowser-agent-chromium
            file: docker/Dockerfile.agent-chromium
            platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
            cache-scope: agent-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push with temp tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:temp-${{ matrix.suffix }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,scope=${{ matrix.cache-scope }},mode=max
          provenance: false
          sbom: false

  merge:
    name: Merge — ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: jbrowser-control
          - image: jbrowser-agent-chromium

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        run: |
          TAG_ARGS=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags | map("-t " + .) | join(" ")')
          docker buildx imagetools create ${TAG_ARGS} \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:temp-amd64-${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:temp-arm64-${{ github.sha }}

      - name: Inspect image
        run: |
          TAG=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[0]')
          docker buildx imagetools inspect "${TAG}"

      - name: Delete temp tags
        run: |
          for arch in amd64 arm64; do
            TAG="temp-${arch}-${{ github.sha }}"
            IMAGE_ID=$(echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}" | tr '[:upper:]' '[:lower:]')
            VERSION_ID=$(echo "${TAG}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            TOKEN=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://ghcr.io/token?scope=package:delete:${IMAGE_ID}" | jq -r '.token' 2>/dev/null || true)
            if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
              curl -s -X DELETE \
                -H "Authorization: Bearer ${TOKEN}" \
                "https://ghcr.io/v2/${IMAGE_ID}/manifests/${VERSION_ID}" || true
            fi
          done
