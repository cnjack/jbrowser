name: Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Control Plane ──────────────────────────────────────────────────────

      - name: Docker metadata — control
        id: meta-control
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/jbrowser-control
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & Push — control
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.control
          push: true
          tags: ${{ steps.meta-control.outputs.tags }}
          labels: ${{ steps.meta-control.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=control
          cache-to: type=gha,scope=control,mode=max

      # ── Agent (Chromium) ───────────────────────────────────────────────────

      - name: Docker metadata — agent-chromium
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/jbrowser-agent-chromium
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & Push — agent-chromium
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.agent-chromium
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=agent-chromium
          cache-to: type=gha,scope=agent-chromium,mode=max
